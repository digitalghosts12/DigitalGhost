<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DigitalGhosts</title>
<style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { background: #000; color: #fff; font-family: Arial, sans-serif; margin: 0; padding: 0; text-align: center; }
  .ustBar { display: flex; justify-content: space-between; align-items: center; padding: 15px; }
  .logo { font-size: 28px; font-weight: bold; color: #00ff88; letter-spacing: 2px; text-shadow: 0 0 12px #00ff88; }
  #solSilBtn { display: none; background: red; color: white; border: none; padding: 10px 18px; border-radius: 10px; font-weight: bold; font-size: 14px; }

  .mesajKutusu { background: #111; border: 1px solid #00ff88; border-radius: 14px; padding: 15px; margin: 15px auto; max-width: 550px; text-align: left; user-select: none; -webkit-user-select: none; }

  .secildiYazisi { color: red; font-size: 12px; font-weight: bold; margin-top: 8px; }
  .yoneticiBtn { background: #222; color: #888; border: none; padding: 10px 20px; border-radius: 8px; margin-top: 30px; }

  #sifrePaneli { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); z-index: 300; justify-content: center; align-items: center; }
  #sifreIc { background: #111; border: 1px solid #00ff88; border-radius: 16px; padding: 20px; width: 90%; max-width: 360px; position: relative; padding-top: 45px; }

  #ayarlarPaneli { display: none; background: #111; margin: 15px auto; max-width: 550px; padding: 20px; border-radius: 14px; border: 1px solid #333; }
  input, textarea { width: 100%; padding: 12px; margin: 8px 0; background: #222; color: #fff; border: 1px solid #444; border-radius: 10px; font-size: 16px; }
  #sagAltBtn { display: none; position: fixed; bottom: 20px; right: 20px; background: #00ff88; color: #000; border: none; width: 65px; height: 65px; border-radius: 50%; font-size: 30px; font-weight: bold; box-shadow: 0 0 20px #00ff88; z-index: 100; }
  #yazmaKutusu { display: none; position: fixed; bottom: 95px; right: 15px; left: 15px; background: #111; border: 1px solid #00ff88; padding: 15px; border-radius: 15px; z-index: 101; }
  .gonderBtn { background: #00ff88; color: #000; border: none; padding: 12px; width: 100%; border-radius: 10px; font-weight: bold; font-size: 16px; }
  #eminKutusu { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.9); z-index: 200; justify-content: center; align-items: center; }
  #eminIc { background: #111; border: 2px solid red; padding: 25px; border-radius: 16px; max-width: 320px; width: 90%; }
  .eminBtn { background: red; color: white; border: none; padding: 12px; width: 100%; border-radius: 10px; font-weight: bold; margin-top: 10px; }
  .iptalBtn { background: #333; color: white; border: none; padding: 12px; width: 100%; border-radius: 10px; font-weight: bold; margin-top: 10px; }
  #dilBtn { position: fixed; bottom: 20px; left: 20px; background: #222; color: white; border: 1px solid #00ff88; padding: 12px 18px; border-radius: 30px; font-weight: bold; z-index: 100; }
  #dilPaneli { display: none; position: fixed; bottom: 70px; left: 15px; background: #111; border: 1px solid #00ff88; border-radius: 15px; padding: 10px; z-index: 102; width: 220px; text-align: left; }
  .dilSec { display: block; width: 100%; background: #222; color: white; border: none; padding: 12px; margin: 4px 0; border-radius: 10px; text-align: left; font-size: 15px; }
  .dilSec.aktif { background: #00ff88; color: black; font-weight: bold; }
  .ceviriNot { font-size: 11px; color: #888; margin-top: 5px; }
</style>
</head>
<body>

<div class="ustBar">
  <button id="solSilBtn" onclick="secilenleriSil()">🗑️ <span id="solSilYazi">SİL</span> (<span id="sayi">0</span>)</button>
  <div class="logo">DigitalGhosts</div>
  <button id="ayarlarBtn" onclick="ayarlariAc()">⚙️</button>
</div>

<h1 id="baslik">DigitalGhosts</h1>
<p class="altYazi" id="altBaslik">Resmi Duyuru Sistemi - Herkes Okuyabilir, Sadece Yönetici Yazabilir</p>

<button class="anaBtn" id="duyuruBtn" onclick="duyurulariGoster()">📢 DUYURULARI GÖR</button>

<div id="duyuruAlani"></div>

<button class="yoneticiBtn" id="yoneticiBtn" onclick="sifrePaneliniAc()">⚙️ Yönetici Girişi</button>

<div id="sifrePaneli">
  <div id="sifreIc">
    <button id="sifreX" onclick="sifrePaneliniKapat()">✕</button>
    <h3 style="color:#00ff88; margin:0;" id="sifreBaslik">YÖNETİCİ GİRİŞİ</h3>
    <input type="password" id="sifreInput" placeholder="Şifreni yaz">
    <button class="anaBtn" style="width:100%; padding:12px;" id="girisBtn" onclick="sifreyiDogrula()">GİRİŞ YAP</button>
    <p id="sifreDurum" style="color:red; font-size:13px;"></p>
  </div>
</div>

<div id="ayarlarPaneli">
  <h3 id="ayarlarBaslik">⚙️ AYARLAR</h3>
  <p style="color:#aaa; font-size:14px;" id="ayarlarAciklama">Sadece yönetici kullanabilir.</p>
  <button onclick="siteyiSilSor()" id="siteSilBtn" style="background:red; color:white; border:none; padding:14px; width:100%; border-radius:10px; font-weight:bold;">🗑️ SİTEYİ SİL</button>
  <button onclick="ayarlariKapat()" id="kapatBtn" style="background:#333; color:white; border:none; padding:12px; width:100%; border-radius:10px; margin-top:10px;">Kapat</button>
</div>

<button id="sagAltBtn" onclick="yazmaKutusunuAc()">+</button>

<div id="yazmaKutusu">
  <textarea id="yeniMesajInput" placeholder="Mesajını yaz..."></textarea>
  <button class="gonderBtn" id="gonderBtn" onclick="mesajGonder()">GÖNDER</button>
  <button onclick="yazmaKutusunuKapat()" id="vazgecBtn" style="background:none; border:none; color:#888; margin-top:10px;">Vazgeç</button>
</div>

<button id="dilBtn" onclick="dilPaneliniAc()">🌐 Language</button>
<div id="dilPaneli">
  <b style="font-size:13px;" id="dilSecBaslik">Dil Seç / Select Language</b>
  <button class="dilSec" data-dil="en" onclick="diliDegistir('en')">🇬🇧 English</button>
  <button class="dilSec" data-dil="es" onclick="diliDegistir('es')">🇪🇸 Español</button>
  <button class="dilSec" data-dil="fr" onclick="diliDegistir('fr')">🇫🇷 Français</button>
  <button class="dilSec" data-dil="ru" onclick="diliDegistir('ru')">🇷🇺 Русский</button>
  <button class="dilSec" data-dil="de" onclick="diliDegistir('de')">🇩🇪 Deutsch</button>
  <button class="dilSec" data-dil="tr" onclick="diliDegistir('tr')">🇹🇷 Türkçe</button>
  <button onclick="dilPaneliniKapat()" id="dilKapatBtn" style="background:none; border:none; color:#888; width:100%; margin-top:5px;">Kapat</button>
</div>

<div id="eminKutusu">
  <div id="eminIc">
    <h2 style="color:red; margin:0;" id="eminBaslik">Emin misin?</h2>
    <p id="eminYazi">Bu site ve tüm mesajlar herkesten silinecek! Geri alınamaz!</p>
    <button class="eminBtn" id="eminEvetBtn" onclick="siteyiTamamenSil()">EVET, EMİNİM - SİL</button>
    <button class="iptalBtn" id="eminIptalBtn" onclick="iptalEt()">İPTAL</button>
  </div>
</div>

<script>
  let mesajlar = JSON.parse(localStorage.getItem('dg_mesajlar') || '[]');
  const SIFRE = "qZaS190";
  let yoneticiMi = false;
  let seciliIndexler = new Set();
  let basiliTimer = null;
  let seciliDil = localStorage.getItem('dg_dil') || 'tr';
  let ceviriCache = {};

  let siteSilindiMi = localStorage.getItem('dg_silindi') === 'evet';
  if(siteSilindiMi){
    document.body.innerHTML = "<h1 style='color:red; margin-top:100px;'>DigitalGhosts Silindi</h1><p>Bu site yönetici tarafından silindi.</p>";
  }
  if(mesajlar.length === 0 && !siteSilindiMi){
    mesajlar = [{ tarih: "7 / 11 / 2026 - 14:00", yazi: "selam" }];
    localStorage.setItem('dg_mesajlar', JSON.stringify(mesajlar));
  }

  async function cevir(yazi, hedefDil){
    if(!yazi) return yazi;
    if(hedefDil === 'tr') return yazi;
    let key = yazi + "||" + hedefDil;
    if(ceviriCache[key]) return ceviriCache[key];
    try{
      let url = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=" + hedefDil + "&dt=t&q=" + encodeURIComponent(yazi);
      let res = await fetch(url);
      let data = await res.json();
      let sonuc = "";
      if(data && data[0]) data[0].forEach(p => { if(p[0]) sonuc += p[0]; });
      if(sonuc) { ceviriCache[key] = sonuc; return sonuc; }
    }catch(e){}
    try{
      let res2 = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(yazi) + "&langpair=auto|" + hedefDil);
      let data2 = await res2.json();
      if(data2.responseData && data2.responseData.translatedText) return data2.responseData.translatedText;
    }catch(e){}
    return yazi;
  }

  const arayuz = {
    tr: { alt: "Resmi Duyuru Sistemi - Herkes Okuyabilir, Sadece Yönetici Yazabilir", duyuru: "📢 DUYURULARI GÖR", yonetici: "⚙️ Yönetici Girişi", sifreBaslik: "YÖNETİCİ GİRİŞİ", giris: "GİRİŞ YAP", sifrePlaceholder: "Şifreni yaz", ayarlarBaslik: "⚙️ AYARLAR", ayarlarAciklama: "Sadece yönetici kullanabilir.", siteSil: "🗑️ SİTEYİ SİL", kapat: "Kapat", gonder: "GÖNDER", vazgec: "Vazgeç", mesajPlaceholder: "Mesajını yaz...", eminBaslik: "Emin misin?", eminYazi: "Bu site ve tüm mesajlar herkesten silinecek! Geri alınamaz!", eminEvet: "EVET, EMİNİM - SİL", eminIptal: "İPTAL", solSil: "SİL", dilSecBaslik: "Dil Seç / Select Language", dilKapat: "Kapat", bos: "Henüz duyuru yok.", secildi: "✓ SEÇİLDİ" },
    en: { alt: "Official Announcement System - Everyone Can Read, Only Admin Can Write", duyuru: "📢 SEE ANNOUNCEMENTS", yonetici: "⚙️ Admin Login", sifreBaslik: "ADMIN LOGIN", giris: "LOG IN", sifrePlaceholder: "Write your password", ayarlarBaslik: "⚙️ SETTINGS", ayarlarAciklama: "Only admin can use.", siteSil: "🗑️ DELETE SITE", kapat: "Close", gonder: "SEND", vazgec: "Cancel", mesajPlaceholder: "Write your message...", eminBaslik: "Are you sure?", eminYazi: "This site and all messages will be deleted for everyone! Cannot be undone!", eminEvet: "YES, I'M SURE - DELETE", eminIptal: "CANCEL", solSil: "DELETE", dilSecBaslik: "Select Language", dilKapat: "Close", bos: "No announcements yet.", secildi: "✓ SELECTED" },
    es: { alt: "Sistema Oficial de Anuncios - Todos Pueden Leer, Solo el Admin Puede Escribir", duyuru: "📢 VER ANUNCIOS", yonetici: "⚙️ Acceso Admin", sifreBaslik: "ACCESO ADMIN", giris: "ENTRAR", sifrePlaceholder: "Escribe tu contraseña", ayarlarBaslik: "⚙️ AJUSTES", ayarlarAciklama: "Solo el admin puede usar.", siteSil: "🗑️ ELIMINAR SITIO", kapat: "Cerrar", gonder: "ENVIAR", vazgec: "Cancelar", mesajPlaceholder: "Escribe tu mensaje...", eminBaslik: "¿Estás seguro?", eminYazi: "¡Este sitio y todos los mensajes se eliminarán para todos! ¡No se puede deshacer!", eminEvet: "SÍ, ESTOY SEGURO - ELIMINAR", eminIptal: "CANCELAR", solSil: "ELIMINAR", dilSecBaslik: "Elige idioma", dilKapat: "Cerrar", bos: "Aún no hay anuncios.", secildi: "✓ SELECCIONADO" },
    fr: { alt: "Système d'Annonce Officiel - Tout le Monde Peut Lire, Seul l'Admin Peut Écrire", duyuru: "📢 VOIR LES ANNONCES", yonetici: "⚙️ Connexion Admin", sifreBaslik: "CONNEXION ADMIN", giris: "SE CONNECTER", sifrePlaceholder: "Écris ton mot de passe", ayarlarBaslik: "⚙️ PARAMÈTRES", ayarlarAciklama: "Seul l'admin peut utiliser.", siteSil: "🗑️ SUPPRIMER LE SITE", kapat: "Fermer", gonder: "ENVOYER", vazgec: "Annuler", mesajPlaceholder: "Écris ton message...", eminBaslik: "Tu es sûr ?", eminYazi: "Ce site et tous les messages seront supprimés pour tout le monde ! Irréversible !", eminEvet: "OUI, JE SUIS SÛR - SUPPRIMER", eminIptal: "ANNULER", solSil: "SUPPRIMER", dilSecBaslik: "Choisir la langue", dilKapat: "Fermer", bos: "Pas encore d'annonces.", secildi: "✓ SÉLECTIONNÉ" },
    ru: { alt: "Официальная Система Объявлений - Все Могут Читать, Только Админ Может Писать", duyuru: "📢 ПОСМОТРЕТЬ ОБЪЯВЛЕНИЯ", yonetici: "⚙️ Вход Админа", sifreBaslik: "ВХОД АДМИНА", giris: "ВОЙТИ", sifrePlaceholder: "Напиши пароль", ayarlarBaslik: "⚙️ НАСТРОЙКИ", ayarlarAciklama: "Только админ может использовать.", siteSil: "🗑️ УДАЛИТЬ САЙТ", kapat: "Закрыть", gonder: "ОТПРАВИТЬ", vazgec: "Отмена", mesajPlaceholder: "Напиши сообщение...", eminBaslik: "Ты уверен?", eminYazi: "Этот сайт и все сообщения будут удалены для всех! Нельзя отменить!", eminEvet: "ДА, Я УВЕРЕН - УДАЛИТЬ", eminIptal: "ОТМЕНА", solSil: "УДАЛИТЬ", dilSecBaslik: "Выбрать язык", dilKapat: "Закрыть", bos: "Пока нет объявлений.", secildi: "✓ ВЫБРАНО" },
    de: { alt: "Offizielles Ankündigungssystem - Alle Können Lesen, Nur der Admin Kann Schreiben", duyuru: "📢 ANKÜNDIGUNGEN ANSEHEN", yonetici: "⚙️ Admin Login", sifreBaslik: "ADMIN LOGIN", giris: "EINLOGGEN", sifrePlaceholder: "Schreib dein Passwort", ayarlarBaslik: "⚙️ EINSTELLUNGEN", ayarlarAciklama: "Nur der Admin kann benutzen.", siteSil: "🗑️ SEITE LÖSCHEN", kapat: "Schließen", gonder: "SENDEN", vazgec: "Abbrechen", mesajPlaceholder: "Schreib deine Nachricht...", eminBaslik: "Bist du sicher?", eminYazi: "Diese Seite und alle Nachrichten werden für alle gelöscht! Nicht rückgängig!", eminEvet: "JA, ICH BIN SICHER - LÖSCHEN", eminIptal: "ABBRECHEN", solSil: "LÖSCHEN", dilSecBaslik: "Sprache wählen", dilKapat: "Schließen", bos: "Noch keine Ankündigungen.", secildi: "✓ AUSGEWÄHLT" }
  };

  function arayuzuUygula(dil){
    let t = arayuz[dil] || arayuz['tr'];
    document.getElementById('altBaslik').innerText = t.alt;
    document.getElementById('duyuruBtn').innerText = t.duyuru;
    document.getElementById('yoneticiBtn').innerText = t.yonetici;
    document.getElementById('sifreBaslik').innerText = t.sifreBaslik;
    document.getElementById('girisBtn').innerText = t.giris;
    document.getElementById('sifreInput').placeholder = t.sifrePlaceholder;
    document.getElementById('ayarlarBaslik').innerText = t.ayarlarBaslik;
    document.getElementById('ayarlarAciklama').innerText = t.ayarlarAciklama;
    document.getElementById('siteSilBtn').innerText = t.siteSil;
    document.getElementById('kapatBtn').innerText = t.kapat;
    document.getElementById('gonderBtn').innerText = t.gonder;
    document.getElementById('vazgecBtn').innerText = t.vazgec;
    document.getElementById('yeniMesajInput').placeholder = t.mesajPlaceholder;
    document.getElementById('eminBaslik').innerText = t.eminBaslik;
    document.getElementById('eminYazi').innerText = t.eminYazi;
    document.getElementById('eminEvetBtn').innerText = t.eminEvet;
    document.getElementById('eminIptalBtn').innerText = t.eminIptal;
    document.getElementById('solSilYazi').innerText = t.solSil;
    document.getElementById('dilSecBaslik').innerText = t.dilSecBaslik;
    document.getElementById('dilKapatBtn').innerText = t.dilKapat;
  }

  function diliDegistir(dil){
    seciliDil = dil;
    localStorage.setItem('dg_dil', dil);
    document.querySelectorAll('.dilSec').forEach(b => b.classList.toggle('aktif', b.dataset.dil === dil));
    arayuzuUygula(dil);
    dilPaneliniKapat();
    duyurulariGoster();
  }

  function dilPaneliniAc(){
    let p = document.getElementById('dilPaneli');
    p.style.display = (p.style.display === 'block') ? 'none' : 'block';
  }
  function dilPaneliniKapat(){ document.getElementById('dilPaneli').style.display = 'none'; }

  function sifrePaneliniAc(){
    let p = document.getElementById('sifrePaneli');
    if(p.style.display === 'flex'){ p.style.display = 'none'; }
    else { p.style.display = 'flex'; document.getElementById('sifreInput').focus(); }
  }
  function sifrePaneliniKapat(){ document.getElementById('sifrePaneli').style.display = 'none'; }

  function ayarlariAc(){
    if(!yoneticiMi) return;
    let p = document.getElementById('ayarlarPaneli');
    p.style.display = (p.style.display === 'block') ? 'none' : 'block';
  }
  function ayarlariKapat(){ document.getElementById('ayarlarPaneli').style.display = 'none'; }

  function yazmaKutusunuAc(){
    let p = document.getElementById('yazmaKutusu');
    p.style.display = (p.style.display === 'block') ? 'none' : 'block';
  }
  function yazmaKutusunuKapat(){ document.getElementById('yazmaKutusu').style.display = 'none'; }

  async function duyurulariGoster(){
    let alan = document.getElementById('duyuruAlani');
    if(alan.style.display === 'block'){ alan.style.display = 'none'; return; }
    let t = arayuz[seciliDil] || arayuz['tr'];
    alan.style.display = 'block';
    if(mesajlar.length === 0){ alan.innerHTML = "<p>"+t.bos+"</p>"; return; }
    alan.innerHTML = "";
    mesajlar.forEach((m, i) => {
      let div = document.createElement('div');
      div.className = 'mesajKutusu' + (seciliIndexler.has(i) ? ' secili' : '');
      div.id = 'mesaj-' + i;
      div.innerHTML = `<div class="tarihSatiri">📅 ${m.tarih}</div><div class="mesajYazisi">${m.yazi}</div>${seciliDil !== 'tr' ? '<div class="ceviriNot">Çevriliyor... ⏳</div>' : ''}${seciliIndexler.has(i) ? '<div class="secildiYazisi">'+t.secildi+'</div>' : ''}`;
      div.addEventListener('click', () => {
        if(!yoneticiMi) return;
        if(seciliIndexler.size > 0){
          if(seciliIndexler.has(i)) seciliIndexler.delete(i);
          else seciliIndexler.add(i);
          let alan2 = document.getElementById('duyuruAlani');
          alan2.style.display = 'none';
          duyurulariGoster();
        }
      });
      div.addEventListener('touchstart', () => basiliBasla(i), {passive:true});
      div.addEventListener('touchend', basiliBirak);
      div.addEventListener('mousedown', () => basiliBasla(i));
      div.addEventListener('mouseup', basiliBirak);
      div.addEventListener('mouseleave', basiliBirak);
      div.addEventListener('contextmenu', e => e.preventDefault());
      alan.appendChild(div);
      if(seciliDil !== 'tr'){
        cevir(m.yazi, seciliDil).then(cevrilmis => {
          let el = document.getElementById('mesaj-' + i);
          if(el){
            let yaziEl = el.querySelector('.mesajYazisi');
            let notEl = el.querySelector('.ceviriNot');
            if(yaziEl) yaziEl.innerText = cevrilmis;
            if(notEl) notEl.innerText = 'Orijinal: ' + m.yazi;
          }
        });
      }
    });
    solSilGuncelle();
  }

  function sifreyiDogrula(){
    let girilen = document.getElementById('sifreInput').value;
    if(girilen === SIFRE){
      yoneticiMi = true;
      document.getElementById('sifreDurum').style.color = "#00ff88";
      document.getElementById('sifreDurum').innerText = "Şifre doğrulandı!";
      document.getElementById('sagAltBtn').style.display = 'block';
      document.getElementById('ayarlarBtn').style.display = 'block';
      document.getElementById('sifrePaneli').style.display = 'none';
      alert("Hoş geldin Patron!");
      let alan = document.getElementById('duyuruAlani');
      alan.style.display = 'none';
      duyurulariGoster();
    } else { alert("Yanlış şifre!"); }
  }
  function mesajGonder(){
    if(!yoneticiMi){ alert("Önce şifre gir!"); return; }
    let yazi = document.getElementById('yeniMesajInput').value.trim();
    if(!yazi){ alert("Boş mesaj gönderemezsin!"); return; }
    let s = new Date();
    let tarih = String(s.getDate()).padStart(2,'0') + " / " + String(s.getMonth()+1).padStart(2,'0') + " / " + s.getFullYear() + " - " + String(s.getHours()).padStart(2,'0') + ":" + String(s.getMinutes()).padStart(2,'0');
    mesajlar.unshift({ tarih: tarih, yazi: yazi });
    localStorage.setItem('dg_mesajlar', JSON.stringify(mesajlar));
    document.getElementById('yeniMesajInput').value = "";
    yazmaKutusunuKapat();
    let alan = document.getElementById('duyuruAlani');
    alan.style.display = 'none';
    duyurulariGoster();
    alert("Mesaj yayınlandı! Her dilde görünecek.");
  }
  function basiliBasla(index){
    if(!yoneticiMi) return;
    if(seciliIndexler.size > 0) return;
    basiliTimer = setTimeout(() => { seciliIndexler.add(index); if(navigator.vibrate) navigator.vibrate(120); let a=document.getElementById('duyuruAlani'); a.style.display='none'; duyurulariGoster(); }, 2000);
  }
  function basiliBirak(){ if(basiliTimer) clearTimeout(basiliTimer); }
  function solSilGuncelle(){
    let btn = document.getElementById('solSilBtn');
    if(seciliIndexler.size > 0){ btn.style.display = 'block'; document.getElementById('sayi').innerText = seciliIndexler.size; }
    else btn.style.display = 'none';
  }
  function secilenleriSil(){
    if(!yoneticiMi) return;
    if(!confirm(seciliIndexler.size + " mesaj silinsin mi?")) return;
    mesajlar = mesajlar.filter((_, i) => !seciliIndexler.has(i));
    localStorage.setItem('dg_mesajlar', JSON.stringify(mesajlar));
    seciliIndexler.clear();
    let a=document.getElementById('duyuruAlani'); a.style.display='none'; duyurulariGoster();
    alert("Silindi!");
  }
  function siteyiSilSor(){ document.getElementById('eminKutusu').style.display = 'flex'; }
  function iptalEt(){ document.getElementById('eminKutusu').style.display = 'none'; document.getElementById('ayarlarPaneli').style.display = 'none'; }
  function siteyiTamamenSil(){
    localStorage.removeItem('dg_mesajlar');
    localStorage.setItem('dg_silindi', 'evet');
    document.body.innerHTML = "<h1 style='color:red; margin-top:100px;'>DigitalGhosts Silindi</h1><p>Bu site yönetici tarafından silindi. Herkes için kapandı.</p>";
  }

  arayuzuUygula(seciliDil);
  document.querySelectorAll('.dilSec').forEach(b => b.classList.toggle('aktif', b.dataset.dil === seciliDil));
</script>

</body>
</html>
